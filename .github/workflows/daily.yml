name: Daily Activity

on:
  schedule:
    # Cada día a las 00:00 UTC (19:00 CST del día anterior)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pulse N commits
        env:
          COMMITS: ${{ vars.PULSE_COMMITS }}
        run: |
          if [ -z "$COMMITS" ]; then
            COMMITS=$((RANDOM % 35 + 1))
          fi
          echo "🔔 Hoy van $COMMITS commits"

          DATE=$(date -u +"%Y-%m-%d")
          touch diary.md

          for i in $(seq 1 $COMMITS); do
            TS=$(date -u +"%H:%M:%S")
            echo "## ${DATE} · pulse #${i} @ ${TS} UTC" >> diary.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add diary.md
            git commit -m "pulse: ${DATE} #${i}"
          done

          git push
