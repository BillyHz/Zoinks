name: Daily Activity

on:
  schedule:
    # Cada día a las 00:00 UTC (= 18:00 CST)
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-pulse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pulse N commits
        env:
          COMMITS: ${{ vars.PULSE_COMMITS || '' }}
          GH_USER:  BillyHz
          GH_EMAIL: billy.hernandez.bhs@gmail.com
        run: |
          set -euo pipefail

          if [ -z "$COMMITS" ]; then
            COMMITS=$((RANDOM % 35 + 1))
          fi
          echo "🔔 Hoy van $COMMITS commits como $GH_USER <$GH_EMAIL>"

          # Autor real para que GitHub sume al contribution graph
          git config user.name  "$GH_USER"
          git config user.email "$GH_EMAIL"

          DATE=$(date -u +"%Y-%m-%d")
          touch diary.md

          # Idempotencia: si ya hay entradas de hoy, no duplicar
          if grep -q "^## ${DATE}" diary.md; then
            echo "ℹ️  Ya hay pulses de ${DATE}; saliendo sin duplicar"
            exit 0
          fi

          for i in $(seq 1 "$COMMITS"); do
            TS=$(date -u +"%H:%M:%S")
            echo "## ${DATE} · pulse #${i} @ ${TS} UTC" >> diary.md
            git add diary.md
            git commit -m "pulse: ${DATE} #${i}"
          done

          git push
